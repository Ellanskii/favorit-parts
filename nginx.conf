# ключ API открыт через прокси, поэтому ограничиваем частоту запросов с одного IP
limit_req_zone $binary_remote_addr zone=api:10m rate=3r/s;

server {
    listen 80;
    root /usr/share/nginx/html;

    # реальный IP клиента из заголовка прокси Coolify, иначе лимит будет общим на всех
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ключ подставляется из переменной окружения API_KEY при старте контейнера
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        set $args "key=${API_KEY}&$args";
        proxy_pass http://api.favorit-parts.ru/hs/hsprice/;
        proxy_set_header Host api.favorit-parts.ru;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
