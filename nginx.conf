server {
    listen 80;
    root /usr/share/nginx/html;

    # ключ подставляется из переменной окружения API_KEY при старте контейнера
    location /api/ {
        set $args "key=${API_KEY}&$args";
        proxy_pass http://api.favorit-parts.ru/hs/hsprice/;
        proxy_set_header Host api.favorit-parts.ru;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
