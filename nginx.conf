server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api.favorit-parts.ru/hs/hsprice/;
        proxy_set_header Host api.favorit-parts.ru;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
